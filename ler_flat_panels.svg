<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920" role="img" aria-labelledby="title description">
  <title id="title">Land Equivalent Ratio for agrivoltaics with flat photovoltaic panels</title>
  <desc id="description">The Land Equivalent Ratio is the sum of the crop yield in an agrivoltaic system, adjusted by the factor x and divided by crop yield in a reference crop-only area, and the agrivoltaic electricity yield divided by electricity yield from a conventional ground-mounted photovoltaic system. Illustrations compare all three systems. Agrivoltaic panels are horizontal, with crops below and a marked crop-loss zone near a support.</desc>
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .title { fill: #172b4d; font-size: 32px; font-weight: 700; text-anchor: middle; }
      .subtitle { fill: #52627a; font-size: 16px; text-anchor: middle; }
      .card { fill: #ffffff; stroke: #d6deea; stroke-width: 1.5; }
      .head { fill: #172b4d; font-size: 18px; font-weight: 700; }
      .body { fill: #334155; font-size: 14px; }
      .small { fill: #52627a; font-size: 12px; }
      .ground { stroke: #8b7355; stroke-width: 3; }
      .crop { fill: none; stroke: #568344; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .panel { fill: #244c75; stroke: #163653; stroke-width: 1.5; }
      .panel-grid { fill: none; stroke: #91b1ca; stroke-width: 1; }
      .yield { fill: #172b4d; font-size: 17px; font-weight: 700; text-anchor: middle; }
      .math { fill: #172b4d; font-size: 34px; font-weight: 600; }
      .math-label { fill: #334155; font-size: 20px; }
      .fraction-rule { stroke: #172b4d; stroke-width: 2; }
      .accent-green { fill: #eaf3e5; }
      .accent-blue { fill: #e8f1f8; }
      .accent-amber { fill: #fff3df; }
    </style>
    <pattern id="loss-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#fff3df" />
      <line x1="0" y1="0" x2="0" y2="8" stroke="#d88a20" stroke-width="2" />
    </pattern>
  </defs>

  <rect width="1400" height="920" fill="#f7f9fc" />
  <text x="700" y="52" class="title">Land Equivalent Ratio (LER) in agrivoltaics</text>
  <text x="700" y="81" class="subtitle">Combined land productivity of crop and electricity production · flat PV panels (0° inclination)</text>

  <g>
    <rect x="50" y="112" width="1300" height="178" rx="14" class="card" />
    <text x="700" y="148" class="head" text-anchor="middle">LER combines the crop and energy contributions</text>

    <text x="385" y="221" class="math">LER =</text>

    <text x="623" y="195" class="math-label" text-anchor="middle">Y<tspan baseline-shift="sub" font-size="13">ag,APV</tspan> × x</text>
    <line x1="516" y1="207" x2="730" y2="207" class="fraction-rule" />
    <text x="623" y="240" class="math-label" text-anchor="middle">Y<tspan baseline-shift="sub" font-size="13">ag,ref</tspan></text>

    <text x="776" y="221" class="math">+</text>

    <text x="931" y="195" class="math-label" text-anchor="middle">Y<tspan baseline-shift="sub" font-size="13">e,APV</tspan></text>
    <line x1="846" y1="207" x2="1016" y2="207" class="fraction-rule" />
    <text x="931" y="240" class="math-label" text-anchor="middle">Y<tspan baseline-shift="sub" font-size="13">e,ref</tspan></text>
  </g>

  <g>
    <rect x="50" y="318" width="840" height="456" rx="14" class="card" />
    <rect x="50" y="318" width="840" height="54" rx="14" class="accent-green" />
    <path d="M50 358 V372 H890 V358" fill="#eaf3e5" />
    <text x="78" y="352" class="head">Agrivoltaic system (APV)</text>
    <text x="862" y="350" class="small" text-anchor="end">Side view · modules horizontal</text>

    <circle cx="140" cy="427" r="22" fill="#f4c95d" />
    <path d="M140 392 V381 M140 473 V462 M105 427 H94 M186 427 H175 M115 402 L107 394 M173 460 L165 452 M165 402 L173 394 M107 460 L115 452" stroke="#e0aa30" stroke-width="2" />
    <path d="M275 450 V591 M675 450 V591" stroke="#596b7d" stroke-width="9" />
    <rect x="205" y="421" width="540" height="30" rx="2" class="panel" />
    <path d="M295 421 V451 M385 421 V451 M475 421 V451 M565 421 V451 M655 421 V451" class="panel-grid" />
    <text x="475" y="407" class="small" text-anchor="middle">PV panels · 0° tilt</text>

    <rect x="243" y="585" width="64" height="9" fill="url(#loss-hatch)" />
    <rect x="643" y="585" width="64" height="9" fill="url(#loss-hatch)" />
    <line x1="82" y1="594" x2="850" y2="594" class="ground" />
    <path d="M112 594 v-38 m0 13 -10 -10 m10 17 11 -14 M163 594 v-46 m0 16 -11 -11 m11 18 12 -14 M215 594 v-34 m0 12 -9 -9 m9 16 10 -12 M340 594 v-47 m0 16 -11 -11 m11 18 12 -14 M390 594 v-38 m0 13 -10 -10 m10 17 11 -14 M440 594 v-49 m0 17 -11 -11 m11 19 12 -14 M510 594 v-37 m0 13 -10 -10 m10 17 11 -14 M560 594 v-48 m0 16 -11 -11 m11 18 12 -14 M610 594 v-35 m0 12 -9 -9 m9 16 10 -12 M735 594 v-47 m0 16 -11 -11 m11 18 12 -14 M790 594 v-37 m0 13 -10 -10 m10 17 11 -14 M827 594 v-43 m0 15 -10 -10 m10 17 11 -13" class="crop" />

    <path d="M275 487 V557" stroke="#d88a20" stroke-width="1.5" stroke-dasharray="4 4" />
    <path d="M675 487 V557" stroke="#d88a20" stroke-width="1.5" stroke-dasharray="4 4" />
    <line x1="275" y1="516" x2="675" y2="516" stroke="#64748b" stroke-width="1.5" />
    <text x="475" y="540" class="small" text-anchor="middle">Crop production beneath elevated panels</text>
    <path d="M275 602 V620 H307 V602 M675 602 V620 H707 V602" fill="none" stroke="#d88a20" stroke-width="1.5" />
    <text x="491" y="638" class="small" text-anchor="middle" fill="#a66308">Land-loss zones near supports are accounted for by x</text>

    <rect x="77" y="665" width="365" height="77" rx="10" fill="#f3f7ee" stroke="#d5e4ca" />
    <text x="259" y="694" class="yield">Y<tspan baseline-shift="sub" font-size="11">ag,APV</tspan> × x</text>
    <text x="259" y="721" class="small" text-anchor="middle">Adjusted crop yield in the APV system</text>
    <rect x="458" y="665" width="405" height="77" rx="10" fill="#edf4f9" stroke="#cdddea" />
    <text x="660" y="694" class="yield">Y<tspan baseline-shift="sub" font-size="11">e,APV</tspan></text>
    <text x="660" y="721" class="small" text-anchor="middle">Electricity yield from the APV system</text>
  </g>

  <g>
    <rect x="915" y="318" width="435" height="213" rx="14" class="card" />
    <rect x="915" y="318" width="435" height="50" rx="14" class="accent-green" />
    <path d="M915 354 V368 H1350 V354" fill="#eaf3e5" />
    <text x="940" y="351" class="head">Crop-only reference</text>
    <text x="1133" y="398" class="small" text-anchor="middle">Control area · no PV structures</text>
    <line x1="950" y1="464" x2="1315" y2="464" class="ground" />
    <path d="M980 464 v-48 m0 16 -11 -11 m11 18 12 -14 M1030 464 v-40 m0 14 -10 -10 m10 17 11 -13 M1080 464 v-50 m0 17 -11 -11 m11 19 12 -14 M1130 464 v-42 m0 15 -10 -10 m10 17 11 -13 M1180 464 v-49 m0 17 -11 -11 m11 19 12 -14 M1230 464 v-41 m0 14 -10 -10 m10 17 11 -13 M1280 464 v-47 m0 16 -11 -11 m11 18 12 -14" class="crop" />
    <text x="1132" y="500" class="yield">Y<tspan baseline-shift="sub" font-size="11">ag,ref</tspan></text>
    <text x="1132" y="520" class="small" text-anchor="middle">Reference crop yield</text>
  </g>

  <g>
    <rect x="915" y="552" width="435" height="222" rx="14" class="card" />
    <rect x="915" y="552" width="435" height="50" rx="14" class="accent-blue" />
    <path d="M915 588 V602 H1350 V588" fill="#e8f1f8" />
    <text x="940" y="585" class="head">Conventional ground-mounted PV</text>
    <text x="1133" y="631" class="small" text-anchor="middle">Reference energy system · no crops</text>
    <line x1="950" y1="705" x2="1315" y2="705" class="ground" />
    <path d="M1030 668 V701 M1210 668 V701" stroke="#596b7d" stroke-width="6" />
    <rect x="990" y="644" width="260" height="24" rx="2" class="panel" />
    <path d="M1055 644 V668 M1120 644 V668 M1185 644 V668" class="panel-grid" />
    <text x="1120" y="744" class="yield">Y<tspan baseline-shift="sub" font-size="11">e,ref</tspan> · conventional-PV electricity yield</text>
  </g>

  <text x="700" y="824" class="body" text-anchor="middle">LER = (adjusted APV crop yield ÷ crop-only reference yield) + (APV electricity yield ÷ conventional-PV reference yield)</text>
  <text x="700" y="851" class="small" text-anchor="middle">Each ratio compares production with its corresponding single-use reference; LER expresses combined land-use performance.</text>
</svg>
