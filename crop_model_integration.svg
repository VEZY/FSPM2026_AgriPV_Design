<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-labelledby="title description">
  <title id="title">Crop model integration workflow</title>
  <desc id="description">STICS growth drives Archicrop plant maquettes. A scene builder combines maquettes with the agrivoltaic layout, ArchimedLight calculates absorbed light, and PlantBioPhysics simulates leaf and plant processes before exporting results.</desc>
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .title { fill: #172b4d; font-size: 27px; font-weight: 700; text-anchor: middle; }
      .subtitle { fill: #52627a; font-size: 15px; text-anchor: middle; }
      .card { fill: #ffffff; stroke: #d6deea; stroke-width: 1.5; }
      .head { font-size: 17px; font-weight: 700; fill: #172b4d; }
      .body { font-size: 14px; fill: #475569; }
      .flow { fill: none; stroke: #64748b; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .data { fill: none; stroke: #16834a; stroke-width: 2.7; stroke-dasharray: 8 5; stroke-linecap: round; marker-end: url(#arrow-data); }
      .flow-label { fill: #334155; font-size: 12px; font-weight: 600; text-anchor: middle; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#64748b" />
    </marker>
    <marker id="arrow-data" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#16834a" />
    </marker>
  </defs>

  <rect width="1100" height="760" fill="#f7f9fc" />
  <text x="550" y="48" class="title">Crop Model Integration Framework</text>
  <text x="550" y="76" class="subtitle">From STICS crop growth to spatial AgriPV simulation and outputs</text>

  <!-- Connectors are placed behind the component cards. -->
  <path d="M185 270 V350" class="flow" />
  <path d="M315 420 H345 C365 420 362 310 390 310" class="flow" />
  <path d="M690 285 C730 285 745 210 785 210" class="flow" />
  <path d="M915 280 V350" class="data" />
  <path d="M785 465 C735 465 728 635 690 635" class="flow" />

  <g transform="translate(55 130)">
    <rect width="260" height="140" rx="12" class="card" />
    <path d="M12 0 H248 Q260 0 260 12 V38 H0 V12 Q0 0 12 0" fill="#e6f0ff" />
    <circle cx="24" cy="19" r="7" fill="#3674c5" />
    <text x="42" y="25" class="head">STICS</text>
    <text x="20" y="68" class="body">Crop growth and phenology</text>
    <text x="20" y="92" class="body">Weather, soil and management</text>
    <text x="20" y="116" class="body">Daily growth variables</text>
  </g>

  <g transform="translate(55 350)">
    <rect width="260" height="150" rx="12" class="card" />
    <path d="M12 0 H248 Q260 0 260 12 V38 H0 V12 Q0 0 12 0" fill="#e8f5e9" />
    <circle cx="24" cy="19" r="7" fill="#4f8e45" />
    <text x="42" y="25" class="head">Archicrop</text>
    <text x="20" y="69" class="body">Uses STICS crop development</text>
    <text x="20" y="94" class="body">Builds date-specific 3D plants</text>
    <text x="20" y="119" class="body">Exports OBJ and MTG maquettes</text>
  </g>

  <g transform="translate(390 235)">
    <rect width="300" height="150" rx="12" class="card" />
    <path d="M12 0 H288 Q300 0 300 12 V38 H0 V12 Q0 0 12 0" fill="#eeeafd" />
    <circle cx="24" cy="19" r="7" fill="#7663b5" />
    <text x="42" y="25" class="head">Scene Builder</text>
    <text x="20" y="69" class="body">Combines plant geometry and PV layout</text>
    <text x="20" y="94" class="body">Adds ground and planting arrangement</text>
    <text x="20" y="119" class="body">Builds the 3D simulation scene</text>
  </g>

  <g transform="translate(785 130)">
    <rect width="260" height="150" rx="12" class="card" />
    <path d="M12 0 H248 Q260 0 260 12 V38 H0 V12 Q0 0 12 0" fill="#fff3df" />
    <circle cx="24" cy="19" r="7" fill="#d88a20" />
    <text x="42" y="25" class="head">ArchimedLight</text>
    <text x="20" y="69" class="body">Simulates light in the 3D scene</text>
    <text x="20" y="94" class="body">Calculates absorbed PAR and NIR</text>
    <text x="20" y="119" class="body">Provides aPPFD to physiology</text>
  </g>

  <g transform="translate(785 350)">
    <rect width="260" height="150" rx="12" class="card" />
    <path d="M12 0 H248 Q260 0 260 12 V38 H0 V12 Q0 0 12 0" fill="#e4f5f7" />
    <circle cx="24" cy="19" r="7" fill="#3193a1" />
    <text x="42" y="25" class="head">PlantBioPhysics</text>
    <text x="20" y="69" class="body">Models leaf physiology and energy</text>
    <text x="20" y="94" class="body">Uses light and weather forcing</text>
    <text x="20" y="119" class="body">Aggregates plant-level results</text>
  </g>

  <g transform="translate(390 585)">
    <rect width="300" height="100" rx="12" class="card" />
    <path d="M12 0 H288 Q300 0 300 12 V38 H0 V12 Q0 0 12 0" fill="#edf1f6" />
    <circle cx="24" cy="19" r="7" fill="#64748b" />
    <text x="42" y="25" class="head">Simulation outputs</text>
    <text x="20" y="67" class="body">Leaf, light and plant CSV tables</text>
    <text x="20" y="88" class="body">Scene recipe for reconstruction</text>
  </g>

  <g>
    <rect x="201" y="302" width="90" height="22" rx="11" fill="#f7f9fc" />
    <text x="246" y="317" class="flow-label">Growth data</text>
    <rect x="318" y="390" width="78" height="22" rx="11" fill="#f7f9fc" />
    <text x="357" y="405" class="flow-label">OBJ / MTG</text>
    <rect x="695" y="236" width="78" height="22" rx="11" fill="#f7f9fc" />
    <text x="734" y="251" class="flow-label">3D scene</text>
    <rect x="924" y="302" width="66" height="22" rx="11" fill="#f7f9fc" />
    <text x="957" y="317" class="flow-label" fill="#16834a">aPPFD</text>
    <rect x="708" y="535" width="120" height="22" rx="11" fill="#f7f9fc" />
    <text x="768" y="550" class="flow-label">Simulation results</text>
  </g>
</svg>
