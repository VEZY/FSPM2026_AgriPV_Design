<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions -->
  <defs>
    <style type="text/css"><![CDATA[
      .module {
        fill: #E3F2FD;
        stroke: #2196F3;
        stroke-width: 2;
        rx: 12;
        ry: 12;
      }
      .module-dark {
        fill: #1565C0;
        stroke: #42A5F5;
        stroke-width: 2;
        rx: 12;
        ry: 12;
      }
      .module-light-text {
        fill: #FFFFFF;
        font-family: 'Helvetica Neue', Arial, sans-serif;
        font-size: 14px;
        font-weight: 600;
        text-anchor: middle;
      }
      .module-dark-text {
        fill: #FFFFFF;
        font-family: 'Helvetica Neue', Arial, sans-serif;
        font-size: 14px;
        font-weight: 600;
        text-anchor: middle;
      }
      .connection {
        fill: none;
        stroke: #666666;
        stroke-width: 2;
        marker-end: url(#arrowhead);
      }
      .connection-dark {
        fill: none;
        stroke: #90CAF9;
        stroke-width: 2;
        marker-end: url(#arrowhead-dark);
      }
      .data-flow {
        fill: none;
        stroke: #4CAF50;
        stroke-width: 2.5;
        stroke-dasharray: 8, 4;
        marker-end: url(#arrowhead-green);
      }
      .data-flow-dark {
        fill: none;
        stroke: #81C784;
        stroke-width: 2.5;
        stroke-dasharray: 8, 4;
        marker-end: url(#arrowhead-green-dark);
      }
      .label {
        fill: #333333;
        font-family: 'Helvetica Neue', Arial, sans-serif;
        font-size: 12px;
        text-anchor: middle;
      }
      .label-dark {
        fill: #FFFFFF;
        font-family: 'Helvetica Neue', Arial, sans-serif;
        font-size: 12px;
        text-anchor: middle;
      }
      .title {
        fill: #212121;
        font-family: 'Helvetica Neue', Arial, sans-serif;
        font-size: 24px;
        font-weight: bold;
        text-anchor: middle;
      }
      .title-dark {
        fill: #FFFFFF;
        font-family: 'Helvetica Neue', Arial, sans-serif;
        font-size: 24px;
        font-weight: bold;
        text-anchor: middle;
      }
      .subtitle {
        fill: #666666;
        font-family: 'Helvetica Neue', Arial, sans-serif;
        font-size: 16px;
        text-anchor: middle;
      }
      .subtitle-dark {
        fill: #BDBDBD;
        font-family: 'Helvetica Neue', Arial, sans-serif;
        font-size: 16px;
        text-anchor: middle;
      }
    ]]></style>

    <!-- Arrowheads -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666666" />
    </marker>
    <marker id="arrowhead-dark" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#90CAF9" />
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4CAF50" />
    </marker>
    <marker id="arrowhead-green-dark" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#81C784" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#FFFFFF" />

  <!-- Title -->
  <text x="400" y="50" class="title">Crop Model Integration Framework</text>
  <text x="400" y="80" class="subtitle">Connecting STICS, Archicrop, ArchimedLight, and PlantBioPhysics</text>

  <!-- STICS Module -->
  <g transform="translate(100, 120)">
    <rect width="180" height="100" class="module" />
    <text x="90" y="40" class="module-light-text">STICS Crop Model</text>
    <text x="90" y="65" class="label">Generates growth dynamics</text>
    <text x="90" y="85" class="label">LAI, height, biomass, phenology</text>
  </g>

  <!-- Archicrop Module -->
  <g transform="translate(100, 280)">
    <rect width="180" height="100" class="module" />
    <text x="90" y="40" class="module-light-text">Archicrop</text>
    <text x="90" y="65" class="label">3D plant geometry generation</text>
    <text x="90" y="85" class="label">OBJ/MTG files from STICS inputs</text>
  </g>

  <!-- ArchimedLight Module -->
  <g transform="translate(420, 120)">
    <rect width="180" height="100" class="module" />
    <text x="90" y="40" class="module-light-text">ArchimedLight</text>
    <text x="90" y="65" class="label">Light interception &amp; absorption</text>
    <text x="90" y="85" class="label">PAR/NIR fluxes, scattering</text>
  </g>

  <!-- PlantBioPhysics Module -->
  <g transform="translate(420, 280)">
    <rect width="180" height="100" class="module" />
    <text x="90" y="40" class="module-light-text">PlantBioPhysics</text>
    <text x="90" y="65" class="label">Physiological processes</text>
    <text x="90" y="85" class="label">Photosynthesis, transpiration</text>
  </g>

  <!-- Scene Builder -->
  <g transform="translate(260, 200)">
    <rect width="180" height="80" class="module" />
    <text x="90" y="30" class="module-light-text">Scene Builder</text>
    <text x="90" y="50" class="label">agripv_scene()</text>
    <text x="90" y="65" class="label">Combines geometry + PV layout</text>
  </g>

  <!-- Connections -->
  <!-- STICS to Archicrop -->
  <path d="M 190 170 Q 210 190 210 220" class="connection" />
  <text x="220" y="200" class="label" transform="rotate(-45 220,200)">Growth parameters</text>

  <!-- Archicrop to Scene Builder -->
  <path d="M 190 330 Q 210 310 240 290" class="connection" />
  <text x="250" y="300" class="label" transform="rotate(-30 250,300)">Plant geometries</text>

  <!-- Scene Builder to ArchimedLight -->
  <path d="M 420 170 Q 390 190 360 220" class="connection" />
  <text x="350" y="200" class="label" transform="rotate(45 350,200)">3D scene</text>

  <!-- ArchimedLight to PlantBioPhysics -->
  <path d="M 510 220 Q 480 200 450 170" class="connection" />
  <text x="440" y="180" class="label" transform="rotate(45 440,180)">Absorbed PAR</text>

  <!-- Data flows (bidirectional) -->
  <!-- STICS to PlantBioPhysics (indirect via growth) -->
  <path d="M 190 170 Q 250 100 380 80" class="data-flow" />
  <text x="280" y="90" class="label" transform="rotate(-20 280,90)">Growth forcing</text>

  <!-- PlantBioPhysics to STICS (feedback) -->
  <path d="M 420 330 Q 360 380 240 380" class="data-flow" />
  <path d="M 240 380 Q 200 380 190 330" class="data-flow" />
  <text x="290" y="360" class="label" transform="rotate(15 290,360)">Water/Nitrogen stress</text>

  <!-- ArchimedLight to Scene Builder (feedback) -->
  <path d="M 420 200 Q 390 220 360 240" class="data-flow" />
  <text x="370" y="230" class="label" transform="rotate(-20 370,230)">Shading effects</text>
</svg>